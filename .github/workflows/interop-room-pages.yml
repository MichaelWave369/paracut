name: ParaCut Interop Room Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/public/**"
      - ".github/workflows/interop-room-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: paracut-interop-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Interop Room
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/desktop/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
